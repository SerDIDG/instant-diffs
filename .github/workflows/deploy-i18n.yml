name: Deploy i18n

on:
  push:
    branches: [ main ]
    paths:
      - 'i18n/*'
      - '!i18n/qqq.json'

  workflow_dispatch:
    inputs:
      project:
        description: Project config key from env.json (PROJECT), e.g. mediawiki or testwiki
        type: string
        required: true
        default: mediawiki

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-i18n:
    runs-on: ubuntu-latest
    # Only run automatically if the repo owner opted in via AUTO_DEPLOY_I18N variable.
    # Manual runs (workflow_dispatch) always work regardless.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_I18N == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Create env.json
        run: printf '%s' "$ENV_JSON" > env.json
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}

      - name: Install dependencies
        run: npm ci

      - name: Deploy i18n
        run: npm run deploy-i18n
        env:
          PROJECT: ${{ inputs.project || 'mediawiki' }}